name: Windows

# Tests on Windows and builds OpenRok-windows.zip (OpenRok\OpenRok.exe).
# PyInstaller only builds for the system it runs on, so the .exe is made here.
# A version tag (v2.0.0-alpha.1...) also publishes the ZIP as a pre-release.
on:
  push:
    branches: [main, windows-pacote]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install -r requirements.txt

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider

      - name: Empacota
        run: pyinstaller --noconfirm main.spec

      # A windowed app that fails to start sits on PyInstaller's error dialog
      # instead of exiting: only the app's own log proves it got going
      - name: Abre o executável
        shell: pwsh
        run: |
          $p = Start-Process dist\OpenRok\OpenRok.exe -PassThru
          Start-Sleep -Seconds 25
          $log = "$env:APPDATA\OpenRok\openrok.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not $p.HasExited) { Stop-Process $p -Force }
          if (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern "captura:" -Quiet))) {
            throw "O OpenRok.exe não chegou a iniciar"
          }

      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\OpenRok -DestinationPath OpenRok-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRok-windows
          path: OpenRok-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} OpenRok-windows.zip --prerelease
          --title "OpenRok ${{ github.ref_name }}"
          --notes "Teste no Windows: extraia o ZIP e abra OpenRok\OpenRok.exe. Na primeira vez o Windows avisa que o app não tem assinatura: Mais informações -> Executar assim mesmo."
